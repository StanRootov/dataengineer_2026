services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: nytaxi-clickhouse
    environment:
      CLICKHOUSE_DB: nytaxi
      CLICKHOUSE_USER: metabase
      CLICKHOUSE_PASSWORD: metabase
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "metabase",
          "--password",
          "metabase",
          "--query",
          "SELECT 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:latest
    container_name: nytaxi-metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Moscow
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  metabase_data: