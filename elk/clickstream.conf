  input {
    file {
      path => "/app/weblog.csv"
      start_position => "beginning"
      sincedb_path => "/dev/null"
    }
  }


filter {
  mutate {
    strip => ["message"]

    add_field => {
      "ingested_at" => "%{@timestamp}"
    }
  }

  csv {
    source => "message"

    columns => [
      "ip_raw",
      "log_time_raw",
      "request_raw",
      "status_code_raw"
    ]
  }

  if "_csvparsefailure" in [tags] {
    mutate {
      add_tag => ["_parsefailure"]

      add_field => {
        "reject_reason" => "csv_parse_failure"
      }
    }
  }

  if "_parsefailure" not in [tags] {
    if [log_time_raw] !~ /^\[/ {
      mutate {
        add_tag => [
          "_parsefailure",
          "_not_weblog"
        ]

        add_field => {
          "reject_reason" => "unexpected_weblog_format"
        }
      }
    }
  }

  if "_parsefailure" not in [tags] {
    dissect {
      mapping => {
        "log_time_raw" => "[%{log_time}"
      }

      tag_on_failure => [
        "_parsefailure",
        "_time_dissectfailure"
      ]
    }

    if "_time_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "reject_reason" => "time_parse_failure"
        }
      }
    }
  }

  if "_parsefailure" not in [tags] {
    dissect {
      mapping => {
        "request_raw" => "%{http_method} %{url} HTTP/%{http_version}"
      }

      tag_on_failure => [
        "_parsefailure",
        "_request_dissectfailure"
      ]
    }

    if "_request_dissectfailure" in [tags] {
      mutate {
        add_field => {
          "reject_reason" => "request_parse_failure"
        }
      }
    }
  }

  if "_parsefailure" not in [tags] {
    date {
      match => [
        "log_time",
        "dd/MMM/yyyy:HH:mm:ss"
      ]

      locale => "en"
      timezone => "UTC"
      target => "@timestamp"

      tag_on_failure => [
        "_parsefailure",
        "_dateparsefailure"
      ]
    }

    if "_dateparsefailure" in [tags] {
      mutate {
        add_field => {
          "reject_reason" => "date_parse_failure"
        }
      }
    }
  }

  if "_parsefailure" not in [tags] {
    if [status_code_raw] !~ /^[1-5][0-9]{2}$/ {
      mutate {
        add_tag => [
          "_parsefailure",
          "_invalid_status_code"
        ]

        add_field => {
          "reject_reason" => "invalid_status_code"
        }
      }
    }
  }

  if "_parsefailure" in [tags] {

    mutate {
      add_field => {
        "ingest_status" => "rejected"
      }
    }

  } else {

    mutate {
      rename => {
        "ip_raw" => "ip"
        "request_raw" => "request"
        "status_code_raw" => "status_code"
      }

      convert => {
        "status_code" => "integer"
      }

      remove_field => [
        "log_time_raw"
      ]

      add_field => {
        "ingest_status" => "valid"
      }
    }
  }
}

  output {

    if [ingest_status] == "valid" {

      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "weblogs-%{+yyyy.MM.dd}"
      }

    } else if [ingest_status] == "rejected" {

      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "weblogs_rejects-%{+yyyy.MM.dd}"
      }
    }
  }